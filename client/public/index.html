<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b6de8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="微聊" />
  <title>微聊</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/app.css?v=2" />
</head>
<body>
  <div id="app">
    <!-- 登录 / 注册 -->
    <div id="authView" class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-badge">微</div>
          <h1>微聊</h1>
          <p class="auth-sub">登录或注册，开启聊天</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-auth-tab="login">登录</button>
          <button class="auth-tab" data-auth-tab="register">注册</button>
        </div>

        <form id="loginForm" class="auth-form">
          <label class="field">
            <span class="field-label">账号</span>
            <input type="text" id="loginUsername" autocomplete="username" placeholder="请输入账号" />
          </label>
          <label class="field">
            <span class="field-label">密码</span>
            <input type="password" id="loginPassword" autocomplete="current-password" placeholder="请输入密码" />
          </label>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>
        </form>

        <form id="registerForm" class="auth-form hidden">
          <label class="field">
            <span class="field-label">账号</span>
            <input type="text" id="regUsername" autocomplete="username" placeholder="至少 3 个字符" />
          </label>
          <label class="field">
            <span class="field-label">昵称</span>
            <input type="text" id="regNickname" placeholder="别人看到的名字（选填）" />
          </label>
          <label class="field">
            <span class="field-label">密码</span>
            <input type="password" id="regPassword" autocomplete="new-password" placeholder="至少 6 个字符" />
          </label>
          <label class="field">
            <span class="field-label">确认密码</span>
            <input type="password" id="regConfirm" autocomplete="new-password" placeholder="再次输入密码" />
          </label>
          <button type="submit" class="btn btn-primary btn-block" id="registerBtn">注 册</button>
        </form>

        <div class="auth-tip">管理员初始账号：admin / admin123</div>
      </div>
    </div>

    <!-- 主界面 -->
    <div id="mainView" class="main hidden">
      <!-- 顶部栏 -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn hidden" id="backBtn" title="返回">‹</button>
          <div class="topbar-title" id="pageTitle">微聊</div>
        </div>
        <div class="topbar-right">
          <span class="online-pill" id="onlinePill" title="在线人数">● <b>0</b> 在线</span>
          <button class="icon-btn" id="menuBtn" title="菜单">☰</button>
        </div>
      </header>

      <!-- 侧边菜单 -->
      <div class="menu-mask hidden" id="menuMask"></div>
      <aside class="menu hidden" id="sideMenu">
        <div class="menu-head">
          <div class="avatar" id="menuAvatar">我</div>
          <div class="menu-user">
            <div class="menu-nick" id="menuNick">昵称</div>
            <div class="menu-account" id="menuAccount">@account</div>
          </div>
        </div>
        <div class="menu-list">
          <button class="menu-item" data-panel="friendsPanel"><span class="mi-icon">👥</span>我的好友</button>
          <button class="menu-item" data-panel="groupsPanel"><span class="mi-icon">💬</span>我的群聊</button>
          <button class="menu-item admin-only hidden" data-panel="adminPanel"><span class="mi-icon">📊</span>管理后台</button>
          <button class="menu-item" id="logoutBtn"><span class="mi-icon">🚪</span>退出登录</button>
        </div>
      </aside>

      <!-- 主页面：会话列表 -->
      <section class="page page-conversations" id="conversationsPage">
        <div class="conv-list" id="convList"></div>
        <div class="empty-state hidden" id="convEmpty">
          <div class="empty-emoji">💬</div>
          <p>还没有聊天</p>
          <p class="empty-sub">从右上角菜单添加好友或加入群聊</p>
        </div>
      </section>

      <!-- 页面：好友 -->
      <section class="page page-panel hidden" id="friendsPanel">
        <div class="panel-inner">
          <div class="search-bar">
            <input type="text" id="friendSearch" placeholder="输入对方账号 / 昵称搜索" />
            <button class="btn btn-primary btn-sm" id="addFriendBtn">添加</button>
          </div>

          <div class="section-block" id="requestBlock">
            <div class="section-title">好友申请 <span class="badge badge-amber" id="requestCount">0</span></div>
            <div id="requestList"></div>
          </div>

          <div class="section-block">
            <div class="section-title">我的好友 <span class="badge" id="friendCount">0</span></div>
            <div id="friendList"></div>
          </div>

          <div class="section-block">
            <div class="section-title">已发出的申请</div>
            <div id="sentList"></div>
          </div>
        </div>
      </section>

      <!-- 页面：群聊 -->
      <section class="page page-panel hidden" id="groupsPanel">
        <div class="panel-inner">
          <div class="action-row">
            <button class="btn btn-primary btn-sm" id="createGroupBtn">创建群聊</button>
            <button class="btn btn-sm" id="refreshGroupsBtn">刷新</button>
          </div>

          <div class="section-block">
            <div class="section-title">我的群聊 <span class="badge" id="groupCount">0</span></div>
            <div id="myGroupList"></div>
          </div>

          <div class="section-block">
            <div class="section-title">可加入的群聊</div>
            <div id="joinableGroupList"></div>
          </div>
        </div>
      </section>

      <!-- 页面：聊天窗口 -->
      <section class="page page-chat hidden" id="chatPage">
        <div class="chat-body" id="chatBody"></div>

        <div class="emoji-panel hidden" id="emojiPanel">
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>

        <div class="chat-input-bar">
          <button class="icon-btn emoji-btn" id="emojiBtn" title="表情">😊</button>
          <textarea id="msgInput" rows="1" placeholder="输入消息…" ></textarea>
          <button class="btn btn-primary btn-sm" id="sendBtn">发送</button>
        </div>
      </section>

      <!-- 页面：管理员后台 -->
      <section class="page page-panel hidden" id="adminPanel">
        <div class="panel-inner">
          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-label">注册账号总数</div>
              <div class="stat-num" id="statTotalUsers">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">今日活跃</div>
              <div class="stat-num" id="statActive">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">当前在线</div>
              <div class="stat-num" id="statOnline">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">群聊数量</div>
              <div class="stat-num" id="statGroups">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">消息总数</div>
              <div class="stat-num" id="statMessages">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">好友关系数</div>
              <div class="stat-num" id="statFriends">0</div>
            </div>
          </div>

          <div class="section-block">
            <div class="section-title">已注册账号</div>
            <div class="user-table-wrap">
              <table class="user-table">
                <thead>
                  <tr>
                    <th>账号</th>
                    <th>昵称</th>
                    <th>角色</th>
                    <th>好友</th>
                    <th>群聊</th>
                    <th>发言</th>
                    <th>注册时间</th>
                    <th>最后登录</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="adminUserTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- 全局提示 -->
    <div class="toast-wrap" id="toastWrap"></div>

    <!-- 模态框 -->
    <div class="modal-mask hidden" id="modalMask">
      <div class="modal" id="modalBox">
        <div class="modal-title" id="modalTitle">标题</div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>
  </div>

  <script src="/app.js?v=2"></script>
</body>
</html>
