# ============================================================
# 微聊 - Nginx 反向代理配置
# ------------------------------------------------------------
# 用法：
#   1. 把本文件复制到 /etc/nginx/conf.d/weiliao.conf
#   2. 修改 server_name 为你的域名
#   3. nginx -t && systemctl reload nginx
# ============================================================

upstream weiliao_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP -> HTTPS 跳转（证书申请前可先注释掉 server 块）
server {
    listen 80;
    listen [::]:80;
    server_name weiliao.example.com;

    # Let's Encrypt 证书校验
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weiliao.example.com;

    # ---- SSL 证书 ----
    # 用 certbot 自动签发后，路径通常如下：
    ssl_certificate     /etc/letsencrypt/live/weiliao.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weiliao.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ---- 上传体积（加密图片 base64 后约 4MB，放宽）----
    client_max_body_size 12m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ---- WebSocket 升级 ----
    location /ws {
        proxy_pass http://weiliao_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长时间保持连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- API 接口 ----
    location /api/ {
        proxy_pass http://weiliao_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- 上传文件 ----
    location /uploads/ {
        proxy_pass http://weiliao_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 前端静态资源 ----
    # 若前端部署在 GitHub Pages，这里只留 404；若是同域部署则直接反代
    location / {
        proxy_pass http://weiliao_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
